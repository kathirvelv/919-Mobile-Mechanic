<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FF5A1F" />
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container Hexagon / Shield -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Outer Shield -->
    <polygon points="50,2 95,26 95,74 50,98 5,74 5,26" fill="url(#darkPlate)" stroke="url(#brandOrange)" stroke-width="3" stroke-linejoin="round" />
    <!-- Inner Accent Rim -->
    <polygon points="50,8 88,29 88,71 50,92 12,71 12,29" fill="#0B0F17" opacity="0.9" stroke="#334155" stroke-width="1.5" />
    
    <!-- Crossed Wrench & Diagnostic Spark / Pulse -->
    <g transform="translate(26, 26)">
      <!-- Wrench head angled -->
      <path d="M12 28 L32 8 C35 5 39 5 42 8 C44 10 44 14 42 16 L38 20 L42 24 L38 28 L34 24 L16 42 C14 44 10 44 8 42 C6 40 6 36 8 34 Z" fill="url(#brandOrange)" opacity="0.9" />
      <!-- Diagnostic Wave / Bolt -->
      <path d="M18 12 L28 24 L21 26 L30 38 L24 28 L30 26 Z" fill="url(#goldAccent)" filter="url(#glow)" />
      <!-- Central gear ring -->
      <circle cx="24" cy="24" r="5" fill="#0B0F17" stroke="url(#goldAccent)" stroke-width="2" />
      <circle cx="24" cy="24" r="2" fill="#FF8A00" />
    </g>
    
    <!-- Little Triangle Flag / Pin representing "Triangle Area" -->
    <polygon points="50,14 54,20 46,20" fill="#FF5A1F" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(125, 20)">
    <!-- "919" Area Code Badge Block -->
    <rect x="0" y="8" width="84" height="42" rx="8" fill="url(#brandOrange)" />
    <text x="42" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="32" fill="#0B0F17" text-anchor="middle" letter-spacing="-1">919</text>
    
    <!-- "MOBILE MECHANIC" Primary Title -->
    <text x="96" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="30" fill="#F8FAFC" letter-spacing="1.5">
      MOBILE<tspan fill="#FF6B00"> MECHANIC</tspan>
    </text>

    <!-- Subtitle Line & Location Pin -->
    <g transform="translate(98, 52)">
      <!-- Mini Map Pin -->
      <path d="M4 2 C2.3 2 1 3.3 1 5 C1 7.2 4 10.5 4 10.5 C4 10.5 7 7.2 7 5 C7 3.3 5.7 2 4 2 Z" fill="#F59E0B" />
      <circle cx="4" cy="4.8" r="1.2" fill="#0B0F17" />
      <text x="13" y="10" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="2">
        CARY &amp; THE TRIANGLE AREA &bull; DRIVEWAY SERVICE
      </text>
    </g>

    <!-- Dealership Grade Quality Line -->
    <g transform="translate(0, 68)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#1E293B" stroke-width="1.5" />
      <!-- Pulsing Dot -->
      <circle cx="4" cy="14" r="3.5" fill="#10B981" />
      <text x="14" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#38BDF8" letter-spacing="1.5">
        DEALERSHIP-GRADE DIAGNOSTICS &bull; 100% FEE CREDIT &bull; 12-MO WARRANTY
      </text>
    </g>
  </g>
</svg>
